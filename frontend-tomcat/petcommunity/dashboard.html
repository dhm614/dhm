<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>宠趣社区 - 总览</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="dashboard">
<header class="site-header">
    <a class="brand" href="home.html">
        <span class="brand-mark">宠</span>
        <span><strong>宠趣社区</strong><small>一站式服务平台</small></span>
    </a>
    <nav class="top-nav" aria-label="页面导航">
        <a data-nav-page="home" href="home.html">主页</a>
        <a data-nav-page="dashboard" href="dashboard.html">总览</a>
        <a data-nav-page="community" href="community.html">社区</a>
        <a data-nav-page="videos" href="videos.html">短视频</a>
        <a data-nav-page="pets" href="pets.html">宠物档案</a>
        <a data-nav-page="services" href="services.html">门店预约</a>
        <a data-nav-page="shop" href="shop.html">模拟商城</a>
        <a data-nav-page="profile" href="profile.html">个人主页</a>
        <a data-nav-page="admin" href="admin.html">后台管理</a>
    </nav>
    <div class="user-tools">
        <label class="api-field">接口 <input id="apiBase" value="http://localhost:8082"></label>
        <span id="userBadge"></span>
        <button type="button" class="secondary" data-action="logout">退出</button>
    </div>
</header>
<main class="page-main">
    <section class="page-heading">
        <h1>总览</h1>
        <p>查看平台运营数据、订单预约状态和用户通知。</p>
    </section>
    <section class="notice" id="notice">总览页面已就绪。</section>
    <div class="toolbar">
        <button data-action="loadDashboard">刷新统计</button>
        <button data-action="loadNotifications">查看通知</button>
        <button data-action="markAllNotifications">全部已读</button>
    </div>
    <div class="metric-grid" id="metrics"></div>
    <section class="panel">
        <h2>今日运营指标</h2>
        <div class="metric-grid dashboard-metrics" id="todayMetrics"></div>
    </section>
    <section class="panel">
        <h2>预约转化</h2>
        <div class="metric-grid dashboard-metrics" id="appointmentConversion"></div>
    </section>
    <div class="two-col">
        <section class="panel">
            <h2>热门商品 TOP10</h2>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>排名</th><th>商品</th><th>价格</th><th>销量</th><th>库存</th></tr></thead>
                    <tbody id="productTop10Rows"></tbody>
                </table>
            </div>
        </section>
        <section class="panel">
            <h2>热门帖子</h2>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>排名</th><th>帖子</th><th>话题</th><th>点赞</th><th>评论</th><th>收藏</th><th>热度</th></tr></thead>
                    <tbody id="hotPostRows"></tbody>
                </table>
            </div>
        </section>
    </div>
    <div class="two-col">
        <section class="panel">
            <h2>预约状态分布</h2>
            <div class="list status-summary-list" id="appointmentStatusList"></div>
        </section>
        <section class="panel">
            <h2>订单状态分布</h2>
            <div class="list status-summary-list" id="orderStatusList"></div>
        </section>
    </div>
    <div class="two-col">
        <section class="panel">
            <h2>近日趋势</h2>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>日期</th><th>用户</th><th>发帖</th><th>预约</th><th>订单</th><th>金额</th></tr></thead>
                    <tbody id="dailyTrendRows"></tbody>
                </table>
            </div>
        </section>
        <section class="panel">
            <h2>通知消息</h2>
            <div class="list" id="notificationList"></div>
        </section>
    </div>
</main>
<script src="assets/app.js"></script>
</body>
</html>
