<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>宠趣社区 - 申请新话题</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="community-topic-apply">
<header class="site-header">
    <a class="brand" href="home.html">
        <span class="brand-mark">宠</span>
        <span><strong>宠趣社区</strong><small>一站式服务平台</small></span>
    </a>
    <nav class="top-nav" aria-label="页面导航">
        <a data-nav-page="home" href="home.html">主页</a>
        <a data-nav-page="dashboard" href="dashboard.html">总览</a>
        <a data-nav-page="community" href="community.html">社区</a>
        <a data-nav-page="videos" href="videos.html">短视频</a>
        <a data-nav-page="pets" href="pets.html">宠物档案</a>
        <a data-nav-page="services" href="services.html">门店预约</a>
        <a data-nav-page="shop" href="shop.html">模拟商城</a>
        <a data-nav-page="profile" href="profile.html">个人主页</a>
        <a data-nav-page="admin" href="admin.html">后台管理</a>
    </nav>
    <div class="user-tools">
        <label class="api-field">接口 <input id="apiBase" value="http://localhost:8082"></label>
        <span id="userBadge"></span>
        <button type="button" class="secondary" data-action="logout">退出</button>
    </div>
</header>
<main class="page-main">
    <section class="page-heading">
        <h1>申请新话题</h1>
        <p>提交新的社区话题，管理员审核并设置排序后才会公开展示。</p>
    </section>
    <section class="notice" id="notice">请先查看已有话题，避免重复申请。</section>
    <div class="toolbar">
        <a class="button-link secondary" href="community.html">返回社区</a>
    </div>
    <section class="panel">
        <h2>申请话题</h2>
        <form id="topicForm" class="inline-form">
            <input name="name" placeholder="话题名称">
            <input name="description" placeholder="话题描述">
            <button type="submit">提交审核</button>
        </form>
        <div class="chips" id="topicChips"></div>
    </section>
</main>
<script src="assets/app.js"></script>
</body>
</html>
