<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>宠趣社区 - 订单结算</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="checkout">
<header class="site-header">
    <a class="brand" href="home.html">
        <span class="brand-mark">宠</span>
        <span><strong>宠趣社区</strong><small>一站式服务平台</small></span>
    </a>
    <nav class="top-nav" aria-label="页面导航">
        <a data-nav-page="home" href="home.html">主页</a>
        <a data-nav-page="dashboard" href="dashboard.html">总览</a>
        <a data-nav-page="community" href="community.html">社区</a>
        <a data-nav-page="videos" href="videos.html">短视频</a>
        <a data-nav-page="pets" href="pets.html">宠物档案</a>
        <a data-nav-page="services" href="services.html">门店预约</a>
        <a data-nav-page="shop" href="shop.html">模拟商城</a>
        <a data-nav-page="profile" href="profile.html">个人主页</a>
        <a data-nav-page="admin" href="admin.html">后台管理</a>
    </nav>
    <div class="user-tools">
        <label class="api-field">接口 <input id="apiBase" value="http://localhost:8082"></label>
        <span id="userBadge"></span>
        <button type="button" class="secondary" data-action="logout">退出</button>
    </div>
</header>
<main class="page-main">
    <section class="page-heading">
        <h1>订单结算</h1>
        <p>核对购物车商品并完成模拟结算，不产生真实支付。</p>
    </section>
    <section class="notice" id="notice">正在加载结算信息。</section>

    <div class="two-col checkout-layout">
        <section class="panel">
            <h2>结算商品</h2>
            <div class="list" id="checkoutItems"></div>
        </section>
        <section class="panel checkout-summary">
            <h2>订单确认</h2>
            <div class="checkout-total-row">
                <span>订单总额</span>
                <strong id="checkoutTotal">¥0.00</strong>
            </div>
            <form id="checkoutForm" class="form-grid">
                <textarea name="remark" placeholder="订单备注，例如配送时间要求"></textarea>
                <button id="checkoutSubmit" type="submit">确认模拟结算</button>
                <button type="button" class="secondary" data-action="goShop">返回商城</button>
            </form>
            <div class="notice checkout-result" id="checkoutResult" aria-live="polite">尚未提交订单。</div>
        </section>
    </div>
</main>
<script src="assets/app.js"></script>
</body>
</html>
