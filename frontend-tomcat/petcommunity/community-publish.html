<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>宠趣社区 - 发布帖子</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="community-publish">
<header class="site-header">
    <a class="brand" href="home.html">
        <span class="brand-mark">宠</span>
        <span><strong>宠趣社区</strong><small>一站式服务平台</small></span>
    </a>
    <nav class="top-nav" aria-label="页面导航">
        <a data-nav-page="home" href="home.html">主页</a>
        <a data-nav-page="dashboard" href="dashboard.html">总览</a>
        <a data-nav-page="community" href="community.html">社区</a>
        <a data-nav-page="videos" href="videos.html">短视频</a>
        <a data-nav-page="pets" href="pets.html">宠物档案</a>
        <a data-nav-page="services" href="services.html">门店预约</a>
        <a data-nav-page="shop" href="shop.html">模拟商城</a>
        <a data-nav-page="profile" href="profile.html">个人主页</a>
        <a data-nav-page="admin" href="admin.html">后台管理</a>
    </nav>
    <div class="user-tools">
        <label class="api-field">接口 <input id="apiBase" value="http://localhost:8082"></label>
        <span id="userBadge"></span>
        <button type="button" class="secondary" data-action="logout">退出</button>
    </div>
</header>
<main class="page-main">
    <section class="page-heading">
        <h1>发布帖子</h1>
        <p>选择一个已通过审核的话题，帖子提交后由管理员审核展示。</p>
    </section>
    <section class="notice" id="notice">请填写帖子内容并选择话题。</section>
    <div class="toolbar">
        <a class="button-link secondary" href="community.html">返回社区</a>
    </div>
    <div class="two-col">
        <section class="panel">
            <h2>发布帖子</h2>
            <form id="postForm" class="form-grid">
                <input name="title" placeholder="标题">
                <input id="selectedPostTopic" name="topic" readonly placeholder="请从右侧选择话题">
                <textarea name="content" placeholder="内容"></textarea>
                <div class="upload-row">
                    <input name="cover" placeholder="封面URL">
                    <input id="postCoverFile" type="file" accept="image/*">
                    <button type="button" data-action="uploadPostCover">上传封面</button>
                </div>
                <button type="submit">发布</button>
            </form>
        </section>
        <section class="panel">
            <h2>选择话题</h2>
            <div class="chips" id="topicChoices"></div>
        </section>
    </div>
</main>
<script src="assets/app.js"></script>
</body>
</html>
