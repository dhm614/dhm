<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>宠趣社区 - 商户商品管理</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="merchant-products">
<header class="site-header">
    <a class="brand" href="home.html"><span class="brand-mark">宠</span><span><strong>宠趣社区</strong><small>一站式服务平台</small></span></a>
    <nav class="top-nav" aria-label="页面导航">
        <a data-nav-page="home" href="home.html">主页</a><a data-nav-page="community" href="community.html">社区</a>
        <a data-nav-page="videos" href="videos.html">短视频</a><a data-nav-page="pets" href="pets.html">宠物档案</a><a data-nav-page="services" href="services.html">门店预约</a><a data-nav-page="shop" href="shop.html">模拟商城</a><a data-nav-page="profile" href="profile.html">个人主页</a>
    </nav>
    <div class="user-tools"><span id="userBadge"></span><button type="button" class="secondary" data-action="logout">退出</button></div>
</header>
<main class="page-main">
    <section class="page-heading"><h1>商户商品管理</h1><p>修改和上下架都会生成审核申请，管理员通过后才生效。</p></section>
    <section class="notice" id="notice">正在读取商品数据。</section>
    <section class="panel">
        <h2>提交修改申请</h2>
        <form id="merchantProductUpdateForm" class="form-grid">
            <input name="id" type="number" placeholder="商品ID">
            <input name="name" placeholder="商品名称">
            <select name="category"><option value="主粮">主粮</option><option value="零食">零食</option><option value="用品">用品</option></select>
            <input name="price" type="number" step="0.01" placeholder="价格">
            <input name="stock" type="number" placeholder="库存">
            <input name="cover" placeholder="商品图片URL">
            <textarea name="description" placeholder="商品说明"></textarea>
            <button type="submit">提交修改申请</button>
        </form>
    </section>
    <div class="two-col">
        <section class="panel"><h2>我的商品</h2><div class="card-grid compact" id="merchantProductList"></div></section>
        <section class="panel"><h2>申请记录</h2><div class="list" id="merchantProductApplicationList"></div></section>
    </div>
</main>
<script src="assets/app.js"></script>
</body>
</html>
