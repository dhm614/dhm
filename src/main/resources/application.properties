spring.application.name=petcommunity3
spring.data.redis.host=localhost
spring.data.redis.port=6379

petcommunity.appointment-lock.ttl-seconds=30

petcommunity.storage.type=${PETCOMMUNITY_STORAGE_TYPE:local}
petcommunity.upload.path=uploads
petcommunity.upload.url-prefix=/uploads
petcommunity.minio.endpoint=${PETCOMMUNITY_MINIO_ENDPOINT:}
petcommunity.minio.access-key=${PETCOMMUNITY_MINIO_ACCESS_KEY:}
petcommunity.minio.secret-key=${PETCOMMUNITY_MINIO_SECRET_KEY:}
petcommunity.minio.bucket=${PETCOMMUNITY_MINIO_BUCKET:pet-community}
petcommunity.minio.public-url=${PETCOMMUNITY_MINIO_PUBLIC_URL:}
